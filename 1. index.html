<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baron &amp; Brooks</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--bg2:#f4f6f4;--card:#ffffff;--line:#e1e7e2;--gold:#1f4d36;--gold2:#123524;--txt:#1a2620;--mute:#6a786f;--err:#b3433f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light}
body{margin:0;background:var(--bg);color:var(--txt);font:400 16px/1.55 'Jost','Helvetica Neue',Arial,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 5vw;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(8px)}
.logo{font-family:'Cinzel Decorative',Georgia,'Times New Roman',serif;font-weight:700;font-size:clamp(20px,3.4vw,30px);color:var(--gold2);letter-spacing:.06em;cursor:pointer;background:none;border:0;padding:0}
.logo small{display:block;font:300 10px/1 'Jost',sans-serif;letter-spacing:.42em;color:var(--mute);margin-top:6px;text-transform:uppercase;text-shadow:none}
nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--gold);background:transparent;color:var(--gold2);padding:9px 18px;cursor:pointer;letter-spacing:.08em;font-size:13px;text-transform:uppercase;transition:.2s}
.btn:hover{background:var(--gold);color:#fff}
.btn.solid{background:var(--gold);color:#fff;font-weight:500}.btn.solid:hover{background:var(--gold2)}
.btn.link{border:0;padding:9px 6px;color:var(--mute)}.btn.link:hover{background:none;color:var(--gold2)}
.btn.danger{border-color:var(--err);color:var(--err)}.btn.danger:hover{background:var(--err);color:#fff}
.hero{text-align:center;padding:52px 5vw 30px}
.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.05}
.hero h1 em{color:var(--gold)}
.hero p{color:var(--mute);max-width:560px;margin:14px auto 26px}
.orn{color:var(--gold);letter-spacing:.5em;font-size:12px;margin-bottom:14px}
.search{max-width:640px;margin:0 auto;display:flex;border:1px solid var(--gold);background:var(--bg2)}
.search input{flex:1;min-width:0;background:none;border:0;padding:14px 18px;outline:none}
.search input::placeholder{color:var(--mute)}
.wrap{padding:0 5vw 60px;max-width:1280px;margin:0 auto}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 22px;align-items:center}
.filters select,.filters input,.f input,.f select,.f textarea{background:var(--bg2);border:1px solid var(--line);padding:10px 12px;outline:none;min-width:0}
.filters select:focus,.filters input:focus,.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold)}
.count{color:var(--mute);margin-left:auto;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.2s;display:flex;flex-direction:column}
.card:hover{border-color:var(--gold);box-shadow:0 6px 20px rgba(18,53,36,.12)}
.ph{aspect-ratio:4/5;background:#edf1ed;display:flex;align-items:center;justify-content:center;font:600 64px 'Cormorant Garamond',serif;color:var(--gold);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:12px 14px 14px}
.price{color:var(--gold2);font:600 22px 'Cormorant Garamond',serif}
.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--mute);font-size:13px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0}
.ov{position:fixed;inset:0;background:rgba(18,53,36,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 4vw;overflow:auto;z-index:50}
.modal{background:var(--bg);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:520px;padding:28px;position:relative;margin:auto}
.modal.wide{max-width:860px}
.x{position:absolute;top:8px;right:12px;background:none;border:0;font-size:28px;color:var(--mute);cursor:pointer}
.modal h2{font-size:30px;color:var(--gold2);margin-bottom:14px}
.f{display:grid;gap:12px}
.f label{display:grid;gap:4px;font-size:13px;color:var(--mute);letter-spacing:.04em}
.f .r{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tabs{display:flex;gap:18px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:8px 0;color:var(--mute);cursor:pointer;text-transform:uppercase;letter-spacing:.1em;font-size:13px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--gold2);border-color:var(--gold)}
.err{color:var(--err);font-size:14px;min-height:20px}
.det{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(max-width:700px){.det{grid-template-columns:1fr}.f .r{grid-template-columns:1fr}.count{margin-left:0;width:100%}}
.det .ph{aspect-ratio:4/5}
.tag{display:inline-block;border:1px solid var(--line);padding:2px 10px;font-size:12px;margin:0 6px 6px 0;color:var(--mute)}
.who{color:var(--gold2);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ph-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:36px 0 18px}
.ph-head h2{font-size:38px}
.sold{position:absolute;top:10px;left:10px;background:var(--gold2);color:#fff;font:500 11px/1 'Jost',sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px}.btn:disabled{opacity:.5;cursor:wait}.det .btn{margin:4px 8px 4px 0}
.modal h3{font-size:22px;margin:16px 0 4px;color:var(--gold2)}.gt{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 10px}.gt th,.gt td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.gt th{color:var(--gold2);font-weight:500;background:var(--bg2)}
footer{border-top:1px solid var(--line);text-align:center;padding:26px 5vw;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<header>
  <button class="logo" onclick="go('home')">Baron &amp; Brooks<small>Second hand · Est. 2026</small></button>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<footer>© Baron &amp; Brooks · Klassiska plagg i andra händer</footer>
<div id="ov" class="ov" style="display:none"></div>

<script>
const CATS=['Damkläder','Herrkläder','Jeans','Skor','Väskor','Accessoarer'];
const CONDS=['Nyskick','Mycket bra skick','Bra skick','Använd'];
const CLOTH=['XXS','XS','S','M','L','XL','XXL','One size'];const SHOES=Array.from({length:13},(_,i)=>'Skor '+(35+i));const SIZES=CLOTH;const JW=Array.from({length:15},(_,i)=>'W'+(26+i));const JL=['L28','L30','L32','L34','L36'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kr=n=>Number(n).toLocaleString('sv-SE')+' kr';
const rd=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};

let users=rd('bb_users',[]), items=rd('bb_items',null), me=rd('bb_me',null);
if(!items){
  const d=(t,p,c,s,k,b,u)=>({id:'s'+t.length+p,title:t,price:p,cat:c,size:s,cond:k,desc:b,seller:u,email:'',img:'',ts:Date.now()-p*1e6,demo:true});
  items=[
    d('Kavaj i ull, mörkgrön',1200,'Herrkläder','L','Mycket bra skick','Klassisk enkelknäppt kavaj i tjock ull med mässingsknappar. Knappt använd.','Exempel'),
    d('Kashmirtröja, kräm',650,'Damkläder','M','Bra skick','Mjuk polotröja i 100 % kashmir. Inga hål eller noppor.','Exempel'),
    d('Trenchcoat, beige',1450,'Damkläder','S','Nyskick','Dubbelknäppt trenchcoat med skärp. Använd en säsong.','Exempel'),
    d('Läderloafers, brun',890,'Skor','Skor 42','Bra skick','Handsydda loafers i mörkbrunt skinn, nysulade.','Exempel'),
    d('Raw denim, indigo',950,'Jeans','W32 L32','Nyskick','Opreparerad selvedge-denim med rak passform. Använd en gång.','Exempel'),
    d('Silkesscarf med hästmotiv',380,'Accessoarer','One size','Mycket bra skick','Handrullade kanter, äkta siden.','Exempel'),
    d('Weekendbag i vaxad bomull',720,'Väskor','One size','Bra skick','Rymlig väska med läderdetaljer och axelrem.','Exempel')
  ];wr('bb_items',items);
}
let view='home', viewUser=null, F={q:'',cat:'',size:'',shoe:'',jw:'',jl:'',cond:'',max:'',sort:'new'};
let cart=rd('bb_cart',[]), orders=rd('bb_orders',[]);

async function hash(pw,salt){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function go(v,u){view=v;viewUser=u||null;closeM();render();window.scrollTo(0,0)}
function openM(html,wide){const o=$('#ov');o.innerHTML='<div class="modal'+(wide?' wide':'')+'"><button class="x" onclick="closeM()" aria-label="Stäng">×</button>'+html+'</div>';o.style.display='flex'}
function closeM(){const o=$('#ov');o.style.display='none';o.innerHTML=''}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});

function renderNav(){
  $('#nav').innerHTML=`<button class="btn link" onclick="guide(0)">Storleksguide</button><button class="btn" onclick="cartView()">Varukorg (${inCart().length})</button>`+(me
   ?`<button class="btn solid" onclick="sellForm()">+ Sälj ett plagg</button><button class="btn link" onclick="go('profile','${esc(me)}')">@${esc(me)}</button><button class="btn link" onclick="logout()">Logga ut</button>`
   :`<button class="btn link" onclick="authForm('login')">Logga in</button><button class="btn solid" onclick="authForm('reg')">Skapa profil</button>`);
}
function render(){
  renderNav();
  if(view==='profile'){
    const mine=items.filter(i=>i.seller===viewUser).sort((a,b)=>b.ts-a.ts);
    $('#main').innerHTML=`<div class="wrap"><div class="ph-head"><h2>@${esc(viewUser)}</h2><span class="meta">${mine.length} plagg till salu</span></div><div class="grid">${mine.map(cardH).join('')||'<div class="empty">Inga plagg uppladdade ännu.</div>'}</div></div>`;
    return;
  }
  const opt=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
  $('#main').innerHTML=`
  <section class="hero"><h1>Klassiska plagg,<br><em>nya ägare</em></h1><p>Ett kuraterat torg för finare plagg: kavajer, denim, skor och tillbehör med själ. Skapa en profil och lägg upp dina egna plagg på några minuter.</p>
  <div class="search"><input id="q" type="search" placeholder="Sök på plagg, märke eller beskrivning…" value="${esc(F.q)}" oninput="F.q=this.value;grid()"></div></section>
  <div class="wrap"><div class="filters">
   <select onchange="F.cat=this.value;grid()"><option value="">Alla kategorier</option>${opt(CATS,F.cat)}</select>
   <select onchange="F.size=this.value;grid()"><option value="">Alla storlekar</option>${opt(SIZES,F.size)}</select>
   <select onchange="F.shoe=this.value;grid()"><option value="">Skostorlek (EU)</option>${opt(SHOES,F.shoe)}</select>
   <select onchange="F.jw=this.value;grid()"><option value="">Jeans midja (W)</option>${opt(JW,F.jw)}</select>
   <select onchange="F.jl=this.value;grid()"><option value="">Jeans benlängd (L)</option>${opt(JL,F.jl)}</select>
   <select onchange="F.cond=this.value;grid()"><option value="">Alla skick</option>${opt(CONDS,F.cond)}</select>
   <input type="number" min="0" placeholder="Maxpris (kr)" value="${esc(F.max)}" style="width:140px" oninput="F.max=this.value;grid()">
   <select onchange="F.sort=this.value;grid()"><option value="new" ${F.sort==='new'?'selected':''}>Nyast först</option><option value="lo" ${F.sort==='lo'?'selected':''}>Lägst pris</option><option value="hi" ${F.sort==='hi'?'selected':''}>Högst pris</option></select>
   <span class="count" id="cnt"></span></div><div class="grid" id="grid"></div></div>`;
  grid();
}
function cardH(i){
  return `<div class="card" onclick="detail('${i.id}')"><div class="ph" style="position:relative">${i.sold?'<span class="sold">Såld</span>':''}${i.img?`<img src="${i.img}" alt="${esc(i.title)}" loading="lazy">`:esc(i.title[0]||'B')}</div><div class="info"><div class="price">${kr(i.price)}</div><div class="t">${esc(i.title)}</div><div class="meta">${esc(i.size)} · ${esc(i.cond)}</div><div class="meta">@${esc(i.seller)}</div></div></div>`;
}
function grid(){
  const q=F.q.trim().toLowerCase();
  let r=items.filter(i=>(!q||(i.title+' '+i.desc+' '+i.cat).toLowerCase().includes(q))&&(!F.cat||i.cat===F.cat)&&(!F.size||i.size===F.size)&&(!F.shoe||i.size===F.shoe)&&(!F.jw||i.size.startsWith(F.jw+' '))&&(!F.jl||i.size.endsWith(' '+F.jl))&&(!F.cond||i.cond===F.cond)&&(!F.max||i.price<=+F.max));
  r.sort((a,b)=>F.sort==='lo'?a.price-b.price:F.sort==='hi'?b.price-a.price:b.ts-a.ts);
  $('#grid').innerHTML=r.map(cardH).join('')||'<div class="empty">Inga plagg matchar din sökning.</div>';
  $('#cnt').textContent=r.length+' plagg';
}
function detail(id){
  const i=items.find(x=>x.id===id);if(!i)return;
  const own=me===i.seller,inC=cart.includes(i.id);
  const contact=i.sold?'<span class="tag">Såld</span>':own?`<button class="btn danger" onclick="delItem('${i.id}')">Ta bort annons</button>`
    :me?`<a class="btn solid" style="text-decoration:none;display:inline-block" href="mailto:${esc(i.email||'')}?subject=${encodeURIComponent('Baron & Brooks: '+i.title)}" ${i.email?'':'onclick="alert(\'Detta är en exempelannons.\');return false"'}>Kontakta säljaren</a>`
    :`<button class="btn" onclick="authForm('login')">Logga in för att kontakta säljaren</button>`;
  openM(`<div class="det"><div class="ph">${i.img?`<img src="${i.img}" alt="">`:esc(i.title[0]||'B')}</div><div><h2>${esc(i.title)}</h2><div class="price" style="font-size:32px;margin-bottom:10px">${kr(i.price)}</div>
  <span class="tag">${esc(i.cat)}</span><span class="tag">Strl ${esc(i.size)}</span><span class="tag">${esc(i.cond)}</span>
  <p class="meta" style="margin:0 0 6px"><button class="who" onclick="guide(guideTab('${esc(i.cat)}'))">Storleksguide</button></p><p style="white-space:pre-wrap">${esc(i.desc)}</p><p class="meta">Säljare: <button class="who" onclick="go('profile','${esc(i.seller)}')">@${esc(i.seller)}</button></p>${contact}${!own&&!i.sold?` <button class="btn solid" onclick="addCart('${i.id}')">${inC?'Ligger i varukorgen':'Lägg i varukorg'}</button>`:''}</div></div>`,true);
}
function authForm(tab){
  const reg=tab==='reg';
  openM(`<div class="tabs"><button class="${reg?'':'on'}" onclick="authForm('login')">Logga in</button><button class="${reg?'on':''}" onclick="authForm('reg')">Skapa profil</button></div>
  <form class="f" onsubmit="${reg?'doReg':'doLogin'}(event)">
   ${reg?'<label>E-post<input name="email" type="email" required autocomplete="email"></label>':''}
   <label>${reg?'Användarnamn':'Användarnamn eller e-post'}<input name="user" required ${reg?'minlength="3" maxlength="20" pattern="[A-Za-z0-9_.\\-]+" title="Bokstäver, siffror, _ . -"':''} autocomplete="username"></label>
   <label>Lösenord${reg?' (minst 8 tecken)':''}<input name="pw" type="password" required ${reg?'minlength="8"':''} autocomplete="${reg?'new-password':'current-password'}"></label>
   <div class="err" id="err"></div><button class="btn solid" type="submit">${reg?'Skapa profil':'Logga in'}</button></form>`);
}
async function doReg(e){
  e.preventDefault();const f=e.target,email=f.email.value.trim().toLowerCase(),u=f.user.value.trim(),pw=f.pw.value;
  if(users.some(x=>x.user.toLowerCase()===u.toLowerCase()))return $('#err').textContent='Användarnamnet är upptaget.';
  if(users.some(x=>x.email===email))return $('#err').textContent='E-postadressen används redan.';
  users.push({email,user:u,h:await hash(pw,u.toLowerCase())});
  if(!wr('bb_users',users)){users.pop();return $('#err').textContent='Kunde inte spara profilen.'}
  me=u;wr('bb_me',me);closeM();render();
}
async function doLogin(e){
  e.preventDefault();const f=e.target,v=f.user.value.trim().toLowerCase();
  const a=users.find(x=>x.user.toLowerCase()===v||x.email===v);
  if(!a||a.h!==await hash(f.pw.value,a.user.toLowerCase()))return $('#err').textContent='Fel användarnamn eller lösenord.';
  me=a.user;wr('bb_me',me);closeM();render();
}
function logout(){me=null;wr('bb_me',null);go('home')}
function sellForm(){
  const o=a=>a.map(x=>`<option>${esc(x)}</option>`).join('');
  openM(`<h2>Sälj ett plagg</h2><form class="f" onsubmit="doSell(event)">
   <label>Rubrik<input name="title" required maxlength="70"></label>
   <div class="r"><label>Pris (kr)<input name="price" type="number" min="1" max="1000000" required></label><label>Kategori<select name="cat" onchange="szOpts(this.form)">${o(CATS)}</select></label></div>
   <div class="r"><label>Storlek<select name="size">${o(SIZES)}</select></label><label>Skick<select name="cond">${o(CONDS)}</select></label></div>
   <label id="lenL" style="display:none">Benlängd (L)<select name="len">${o(JL)}</select></label>
   <label>Beskrivning<textarea name="desc" rows="4" required maxlength="1500"></textarea></label>
   <label>Bild<input name="img" type="file" accept="image/*"></label>
   <button class="btn" type="button" onclick="aiDesc(this)">✨ Skriv beskrivning med AI</button>
   <button class="btn link" type="button" style="justify-self:start;padding-left:0" onclick="guide(guideTab(this.form.cat.value))">Visa storleksguide</button>
   <div class="err" id="err"></div><button class="btn solid" type="submit">Lägg upp annons</button></form>`);
}
const shrink=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)});
async function doSell(e){
  e.preventDefault();const f=e.target,u=users.find(x=>x.user===me);if(!u)return;
  let img='';try{if(f.img.files[0])img=await shrink(f.img.files[0])}catch(x){return $('#err').textContent='Bilden kunde inte läsas.'}
  const it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:f.title.value.trim(),price:Math.round(+f.price.value),cat:f.cat.value,size:f.cat.value==='Jeans'?f.size.value+' '+f.len.value:f.size.value,cond:f.cond.value,desc:f.desc.value.trim(),seller:me,email:u.email,img,ts:Date.now()};
  items.unshift(it);
  if(!wr('bb_items',items)){items.shift();return $('#err').textContent='Lagringen är full. Prova en mindre bild eller ta bort någon annons.'}
  closeM();go('profile',me);
}
const SHIP=59;
const inCart=()=>cart.filter(id=>items.some(i=>i.id===id&&!i.sold));
const saveCart=()=>{wr('bb_cart',cart);renderNav()};
const szOpts=f=>{const c=f.cat.value;f.size.innerHTML=(c==='Skor'?SHOES:c==='Jeans'?JW:CLOTH).map(x=>`<option>${esc(x)}</option>`).join('');$('#lenL').style.display=c==='Jeans'?'grid':'none'};
const toBlob=u=>{const[h,d]=u.split(','),b=atob(d),a=new Uint8Array(b.length);for(let k=0;k<b.length;k++)a[k]=b.charCodeAt(k);return new Blob([a],{type:h.match(/:(.*?);/)[1]})};
function addCart(id){const i=items.find(x=>x.id===id);if(!i||i.sold||i.seller===me)return;if(!cart.includes(id))cart.push(id);saveCart();cartView()}
function rmCart(id){cart=cart.filter(x=>x!==id);saveCart();cartView()}
function cartView(){
  cart=inCart();saveCart();
  const L=cart.map(id=>items.find(i=>i.id===id)),sum=L.reduce((a,i)=>a+i.price,0);
  openM('<h2>Varukorg</h2>'+(L.length?L.map(i=>`<div style="display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)"><div class="ph" style="width:56px;height:70px;font-size:26px;flex:none">${i.img?`<img src="${i.img}" alt="">`:esc(i.title[0]||'B')}</div><div style="flex:1;min-width:0"><div class="t">${esc(i.title)}</div><div class="meta">${esc(i.size)} · @${esc(i.seller)}</div></div><div class="price" style="font-size:18px">${kr(i.price)}</div><button class="btn link" onclick="rmCart('${i.id}')" aria-label="Ta bort">×</button></div>`).join('')+`<p class="meta" style="display:flex;justify-content:space-between;margin:14px 0 4px"><span>Delsumma</span><span>${kr(sum)}</span></p><p class="meta" style="display:flex;justify-content:space-between;margin:0 0 14px"><span>Frakt</span><span>${kr(SHIP)}</span></p><button class="btn solid" style="width:100%" onclick="checkout()">Till kassan · ${kr(sum+SHIP)}</button>`:'<p class="meta">Varukorgen är tom. Hitta ett plagg du gillar och lägg det här.</p>'));
}
function checkout(){
  if(!me)return authForm('login');
  const L=cart.map(id=>items.find(i=>i.id===id&&!i.sold)).filter(Boolean),sum=L.reduce((a,i)=>a+i.price,0);
  if(!L.length)return cartView();
  openM(`<h2>Kassa</h2><form class="f" onsubmit="placeOrder(event)">
   <label>Fullständigt namn<input name="nm" required autocomplete="name"></label>
   <label>Adress<input name="ad" required autocomplete="street-address"></label>
   <div class="r"><label>Postnummer<input name="zp" required pattern="[0-9 ]{5,6}" inputmode="numeric" autocomplete="postal-code"></label><label>Ort<input name="ci" required autocomplete="address-level2"></label></div>
   <label>Betalsätt<select name="pm"><option>Swish</option><option>Kort</option><option>Faktura</option></select></label>
   <p class="meta" style="margin:0">${L.length} plagg · ${kr(sum)} + frakt ${kr(SHIP)}<br><b style="color:var(--gold2)">Totalt ${kr(sum+SHIP)}</b></p>
   <p class="meta" style="margin:0">Demo: ingen riktig betalning sker och inga betaluppgifter sparas.</p>
   <button class="btn solid" type="submit">Slutför köp</button></form>`);
}
function placeOrder(e){
  e.preventDefault();const f=e.target,L=cart.map(id=>items.find(i=>i.id===id&&!i.sold)).filter(Boolean);
  if(!L.length)return cartView();
  const o={id:'BB-'+Date.now().toString(36).toUpperCase(),buyer:me,ids:L.map(i=>i.id),total:L.reduce((a,i)=>a+i.price,0)+SHIP,to:{nm:f.nm.value.trim(),ad:f.ad.value.trim(),zp:f.zp.value.trim(),ci:f.ci.value.trim()},pm:f.pm.value,ts:Date.now()};
  L.forEach(i=>i.sold=true);orders.unshift(o);cart=[];
  wr('bb_items',items);wr('bb_orders',orders);wr('bb_cart',cart);
  openM(`<h2>Tack för ditt köp!</h2><p>Ordernummer <b>${esc(o.id)}</b>. Totalt ${kr(o.total)} via ${esc(o.pm)}.</p><p class="meta">Leverans till ${esc(o.to.nm)}, ${esc(o.to.ad)}, ${esc(o.to.zp)} ${esc(o.to.ci)}.</p><button class="btn solid" onclick="go('home')">Fortsätt handla</button>`);
  render();
}
async function aiDesc(btn){
  const f=btn.form,file=f.img.files[0],er=$('#err'),label=btn.textContent;
  if(!file){er.textContent='Välj en bild först.';return}
  er.textContent='';btn.disabled=true;btn.textContent='Genererar…';
  try{
    const sample=await claude.use('sample');
    if(!sample||!(await sample.limits()).images){er.textContent='AI-beskrivning är inte tillgänglig här.';return}
    const img=toBlob(await shrink(file));
    const r=await sample('Du hjälper en säljare på second hand-marknadsplatsen Baron & Brooks. Titta på bilden och skriv en säljande men ärlig beskrivning på svenska (2–4 meningar): typ av plagg, färg, material och stil, så långt det syns. Hitta inte på märke, storlek eller skick. Svara endast med själva beskrivningen.'+(f.title.value?' Rubrik: '+f.title.value:''),{images:[img],modelTier:'quick',cache:false});
    f.desc.value=r.text.trim();
  }catch(x){er.textContent=x&&x.code==='not_granted'?'Du behöver tillåta AI-funktionen för att använda den.':x&&x.code==='rate_limited'?'För många förfrågningar, vänta en stund.':'Kunde inte generera beskrivning.'}
  finally{btn.disabled=false;btn.textContent=label}
}
const guideTab=c=>({Jeans:2,Skor:3,'Väskor':4,Accessoarer:4})[c]??0;
const tbl=(h,r)=>`<div style="overflow-x:auto"><table class="gt"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function guide(t=0){
  const T=['Tröjor & skjortor','Kavajer & ytterkläder','Jeans & byxor','Skor','Tillbehör'];
  const INT={26:'XXS',27:'XS',28:'XS',29:'S',30:'S',31:'M',32:'M',33:'M/L',34:'L',35:'L',36:'XL',37:'XL',38:'XL',39:'XXL',40:'XXL'};
  const UK=[3,3.5,4.5,5,6,6.5,7.5,8,9,9.5,10.5,11,12];
  const note=x=>`<p class="meta">${x}</p>`;
  let b='';
  if(t===0)b='<h3>Herr</h3>'+tbl(['Storlek','EU','Bröst (cm)','Hals (cm)'],[['XS','44','86–91','37–38'],['S','46–48','91–96','38–39'],['M','50','96–101','40–41'],['L','52','101–106','42–43'],['XL','54','106–111','44–45'],['XXL','56','111–116','45–46']])
   +'<h3>Dam</h3>'+tbl(['Storlek','EU','UK','US','Bröst (cm)','Midja (cm)','Höft (cm)'],[['XXS',32,6,2,'82–85','61–64','86–89'],['XS',34,8,4,'86–89','65–68','90–93'],['S',36,10,6,'90–93','69–72','94–97'],['M',38,12,8,'94–97','73–76','98–101'],['L',40,14,10,'98–101','77–80','102–105'],['XL',42,16,12,'102–105','81–84','106–109']])
   +note('Mät bröstet där det är bredast, över tunna kläder. Mellan två storlekar: ta den mindre för tät passform, den större för ledig.');
  if(t===1)b='<h3>Kavajer, kostymjackor & rockar (herr)</h3>'+tbl(['EU','UK/US (tum)','Storlek','Bröst (cm)'],[[44,34,'XS','86–89'],[46,36,'S','90–93'],[48,38,'M','94–97'],[50,40,'L','98–101'],[52,42,'XL','102–105'],[54,44,'XXL','106–109'],[56,46,'3XL','110–113']])
   +note('EU-storleken är ungefär UK/US-storleken + 10. Dam: använd damtabellen under Tröjor, och välj en storlek upp för ytterkläder som ska bäras över stickat.');
  if(t===2){
    const r=[];for(let w=26;w<=40;w++)r.push(['W'+w,Math.round(w*2.54),INT[w],w%2?(w+15)+'/'+(w+17):w+16]);
    b='<h3>Midja (W)</h3>'+tbl(['Jeans','Midja (cm)','Storlek','EU herr'],r)
     +'<h3>Benlängd (L)</h3>'+tbl(['Märkning','Innerben (cm)','Passform'],[['L28',71,'Extra kort'],['L30',76,'Kort'],['L32',81,'Normal'],['L34',86,'Lång'],['L36',91,'Extra lång']])
     +note('W och L anges i tum: W32 L32 betyder 32 tum midja (ca 81 cm) och 32 tum innerben. Mät ett par jeans som sitter bra, platt över midjan, och dubbla måttet. Dam: W-måttet gäller likadant, men passformen varierar mycket mellan märken.');
  }
  if(t===3)b=tbl(['EU','Fotlängd (cm)','UK','US herr','US dam'],SHOES.map((x,k)=>{const e=35+k;return [e,(e*2/3-1.7).toFixed(1).replace('.',','),UK[k],UK[k]+1,UK[k]+2]}))
   +note('Fotlängden är den säkraste utgångspunkten. Ställ dig på ett papper, markera häl och längsta tå och mät sträckan. Mät på eftermiddagen och utgå från den större foten. UK/US är ungefärliga och kan skilja en halv storlek mellan märken.');
  if(t===4)b=tbl(['Plagg','Så mäter du'],[['Bälte','Mät midjan. Bältesstorlek 85 / 95 / 105 passar ungefär midja 80–110 cm.'],['Mössa & hatt','S–L motsvarar huvudomkrets på ca 55–60 cm.'],['Handskar','Storleken motsvarar ungefär handens omkrets i tum (storlek 8 ≈ 20 cm).'],['Väskor & scarves','Oftast One size. Se mått i annonsen.']]);
  openM('<h2>Storleksguide</h2><div class="tabs" style="flex-wrap:wrap">'+T.map((n,k)=>`<button class="${k===t?'on':''}" onclick="guide(${k})">${n}</button>`).join('')+'</div>'+b+note('Måtten är ungefärliga och sammanställda från flera märkens och butikers storleksguider. Jämför alltid med måtten säljaren anger.'),true);
}
function delItem(id){
  if(!confirm('Ta bort annonsen?'))return;
  items=items.filter(i=>i.id!==id);wr('bb_items',items);closeM();render();
}
if(me&&!users.some(u=>u.user===me)){me=null;wr('bb_me',null)}
render();
</script>
